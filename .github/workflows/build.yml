name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug :ambient-light-module:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: monjaro-widgets-ambient-pro
          path: |
            app/build/outputs/apk/debug/*.apk
            ambient-light-module/build/outputs/apk/debug/*.apk
